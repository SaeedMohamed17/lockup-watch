name: Update lockup tracker

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new filings
        run: python lockup_tracker.py

      - name: Rebuild site
        run: python generate_site.py

      - name: Commit and push updated data + site
        run: |
          git config user.name "lockup-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lockups.db index.html
          git commit -m "Daily update: $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
